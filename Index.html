<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration Form</title>
</head>

<body>

<h2>Patient Registration Form</h2>

<form action="" method="post" name="registration">

<table border="1" cellpadding="8" cellspacing="0">

    <tr>
        <td>1. Patient Name:</td>
        <td>
            <input type="text" name="Patientname"
                   placeholder="Enter patient name here"
                   maxlength="30">
        </td>
    </tr>

    <tr>
        <td>2. Age:</td>
        <td>
            <input type="number" name="age"
                   placeholder="Enter patient age"
                   min="0" max="120">
        </td>
    </tr>

    <tr>
        <td>3. Patient Gender:</td>
        <td>
            <input type="radio" name="patient_gender" value="Male" checked>
            Male

            <input type="radio" name="patient_gender" value="Female">
            Female
        </td>
    </tr>

    <tr>
        <td>4. ID Number:</td>
        <td>
            <input type="text" name="id_number"
                   placeholder="Enter ID number"
                   maxlength="15">
        </td>
    </tr>

    <tr>
        <td>5. Phone Number:</td>
        <td>
            <input type="tel" name="phone_number"
                   placeholder="Enter phone number"
                   maxlength="10">
        </td>
    </tr>

    <tr>
        <td>6. Health Status:</td>
        <td>
            <input type="checkbox" name="service[]" value="Health">
            Health<br>

            <input type="checkbox" name="service[]" value="Acute illness">
            Acute illness<br>

            <input type="checkbox" name="service[]" value="Chronic illness">
            Chronic illness<br>

            <input type="checkbox" name="service[]" value="Recovering">
            Recovering
        </td>
    </tr>

    <tr>
        <td>7. Marital Status:</td>
        <td>
            <input type="radio" name="status" value="Single" checked>
            Single

            <input type="radio" name="status" value="Married">
            Married
        </td>
    </tr>

    <tr>
        <td>8. Next of Kin:</td>
        <td>
            <input type="text" name="next_of_kin"
                   placeholder="Enter name here"
                   maxlength="30">
        </td>
    </tr>

    <tr>
        <td>9. Weight:</td>
        <td>
            <input type="number" name="weight"
                   placeholder="Enter weight"
                   min="0">
        </td>
    </tr>

    <tr>
        <td>10. Patient ID:</td>
        <td>
            <input type="text" name="patient_id"
                   placeholder="Enter patient ID"
                   maxlength="30">
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </td>
    </tr>

</table>

</form>

</body>
</html>
